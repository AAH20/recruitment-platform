global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    platform: recruitment-platform

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'recruitment-api'
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'recruitment-worker'
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8080
    scrape_interval: 15s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - postgres-exporter:9187
    scrape_interval: 30s

  - job_name: 'redis-exporter'
    static_configs:
      - targets:
          - redis-exporter:9121
    scrape_interval: 30s

  - job_name: 'nginx-exporter'
    static_configs:
      - targets:
          - nginx-exporter:9113
    scrape_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - node-exporter:9100
    scrape_interval: 15s

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.recruitment-platform.com/health
          - https://app.recruitment-platform.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
