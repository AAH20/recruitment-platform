apiVersion: v1
kind: Service
metadata:
  name: recruitment-platform
  namespace: recruitment
  labels:
    app: recruitment-platform
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: recruitment-platform
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None
