[project]
name = "recruitment-platform"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "anyio>=4.14.2",
    "certifi>=2024.7.4",
    "click>=8.3.3",
    "starlette>=1.0.1",
    "urllib3>=2.5.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
