name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.recruitment-platform.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_tag }} to staging"
          echo "Image digest: ${{ needs.build.outputs.image_digest }}"
          # Add your staging deployment commands here
          # Example: kubectl set image deployment/app app=${{ needs.build.outputs.image_tag }} --namespace=staging
          # Example: ssh user@staging-server "docker pull ${{ needs.build.outputs.image_tag }} && docker-compose up -d"

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # Add your smoke test commands here
          # Example: curl -sf https://staging.recruitment-platform.example.com/health || exit 1
          # Example: npm run test:smoke -- --env staging

      - name: Health check
        run: |
          echo "Performing health check..."
          # Example: |
          #   for i in {1..5}; do
          #     curl -sf https://staging.recruitment-platform.example.com/health && break
          #     sleep 10
          #   done

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-tests
    environment:
      name: production
      url: https://recruitment-platform.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_tag }} to production"
          echo "Image digest: ${{ needs.build.outputs.image_digest }}"
          # Add your production deployment commands here
          # Example: kubectl set image deployment/app app=${{ needs.build.outputs.image_tag }} --namespace=production
          # Example: ssh user@prod-server "docker pull ${{ needs.build.outputs.image_tag }} && docker-compose up -d"

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          # Example: curl -sf https://recruitment-platform.example.com/health || exit 1
